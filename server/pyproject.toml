[project]
name = "caspian-compass"
version = "0.1.0"
description = "Grounded Azerbaijan travel planning with a Microsoft Foundry hosted multi-agent assistant."
requires-python = ">=3.13"
dependencies = [
    "agent-framework-foundry==1.12.0",
    "agent-framework-foundry-hosting==1.0.0b260821",
    "azure-ai-projects==2.3.0",
    "azure-identity==1.25.3",
    "python-dotenv==1.2.3",
    "pydantic==2.13.5",
    "httpx==0.28.1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "reportlab>=4.2,<5",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.uv]
package = false
