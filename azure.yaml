# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

infra:
    provider: microsoft.foundry
name: caspian-compass
requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
services:
    caspian-compass:
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: A grounded Azerbaijan travel concierge that delegates to itinerary and travel-facts specialists, uses shared deterministic travel tools, and never makes bookings or payments.
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            CASPIAN_FOUNDRY_AGENT_NAME: caspian-compass
            OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false"
            PYTHONNOUSERSITE: "1"
        host: azure.ai.agent
        kind: hosted
        language: python
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Streaming
        name: caspian-compass
        project: server
        protocols:
            - protocol: responses
              version: 2.0.0
        uses:
            - ai-project
    ai-project:
        deployments:
            - model:
                format: OpenAI
                name: gpt-5.4-mini
                version: "2026-03-17"
              name: gpt-5.4-mini
              sku:
                capacity: 50
                name: GlobalStandard
        host: azure.ai.project
